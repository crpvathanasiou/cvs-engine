[tool.poetry]
name = "cvs-engine"
version = "0.1.0"
description = "Reusable experiment infrastructure for AI-assisted Critical View of Safety scoring."
readme = "README.md"
packages = [{ include = "cvs_engine", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
torch = "*"
torchvision = "*"
timm = "*"
lightning = "*"
hydra-core = "*"
torchmetrics = "*"
numpy = "*"
pandas = "*"
pillow = "*"
scikit-learn = "*"
streamlit = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.6.0"
pyright = "^1.1.380"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
